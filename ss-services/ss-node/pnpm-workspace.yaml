packages:
  - 'packages/*'
  - 'packages/ss-collector/*'
  - 'packages/ss-storage/*'
  - 'apps/*'
# pnpm 11 不再读取 package.json 的 pnpm.overrides，迁移至此（与 pnpm-lock.yaml 记录一致）
overrides:
  '@nestjs/common': 10.4.22
  '@nestjs/core': 10.4.22
  '@nestjs/config': 3.3.0
  '@nestjs/event-emitter': 3.0.1
allowBuilds:
  '@nestjs/core': true
  better-sqlite3: true
  sqlite3: true
